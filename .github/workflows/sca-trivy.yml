name: SCA - Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  sca:
    name: Trivy SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Trivy pinned and verified
        env:
          TRIVY_VERSION: "0.71.2"
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget cosign

          ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          wget -q "${BASE_URL}/${ASSET}"
          wget -q "${BASE_URL}/${ASSET}.sigstore.json"

          cosign verify-blob "${ASSET}" \
            --bundle "${ASSET}.sigstore.json" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity="https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v${TRIVY_VERSION}"

          tar -xzf "${ASSET}"
          sudo mv trivy /usr/local/bin/trivy

          trivy --version

      - name: Run Trivy SCA scan and generate SARIF
        run: |
          trivy fs --scanners vuln . --format sarif -o report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          sarif_file: report.sarif
